/* ============ CONFIG: every tunable value lives here ============ */
const C = {

const isTouch=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<700, P=C.perf[isTouch?'touch':'desktop']; C.dust.n=P.dust; C.burst.n=P.burst;

/* ============ SOUND (all synthesised, nothing to license) ============ */
class Sound {

/* ============ PROCEDURAL TEXTURES ============ */
function skinMaps(){
  const s=1024, a=cvs(s), g=a.getContext('2d'); g.fillStyle=C.skin.base; g.fillRect(0,0,s,s);
  for(let i=0;i<520;i++){ const x=rnd(0,s), y=rnd(0,s), r=rnd(25,110), t=C.skin.tones[i%C.skin.tones.length], gr=g.createRadialGradient(x,y,0,x,y,r);

function clothMaps(){
  const s=256, a=cvs(s), g=a.getContext('2d'); g.fillStyle=C.pal.cloth; g.fillRect(0,0,s,s);
  g.strokeStyle='rgba(255,255,255,.05)'; g.lineWidth=1; for(let i=0;i<s;i+=3){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,s); g.stroke(); g.beginPath(); g.moveTo(0,i); g.lineTo(s,i); g.stroke(); }

    this.rings=[0,1].map(i=>{ const m=new THREE.Mesh(new THREE.TorusGeometry(C.logo.ring*(1+i*.16),C.logo.tube,24,220),new THREE.MeshStandardMaterial({ color:i?C.pal.violet:C.pal.gold, emissive:i?C.pal.violet:C.pal.gold, emissiveIntensity:1.4, metalness:.9, roughness:.2 })); m.rotation.set(Math.PI/2.6*(i?-1:1),0,i*.6); this.logo.add(m); return m; });

    const g=new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(new Float32Array(C.burst.n*3),3));

  }
  _idle(){ return { rSh:.04, rAbd:.1, rEl:-.15, rWr:0, lSh:.04, lAbd:.1, lEl:-.15, twist:0, lean:0, k:C.body.stance, look:0 }; }
  _apply(t){
    const p=this.pose, J=this.J, b=Math.sin(t*1.6)*.008, [L1,L2]=C.body.legs;
    J.rSh.rotation.set(p.rSh,0,-p.rAbd); J.lSh.rotation.set(p.lSh,0,p.lAbd); J.rEl.rotation.x=p.rEl; J.lEl.rotation.x=p.lEl; J.rWr.rotation.x=p.rWr;
    J.spine.rotation.set(p.lean,p.twist,0); J.chest.scale.set(1.3*(1+b),1,.78*(1+b));
    J.head.rotation.set(-p.lean*.6-p.look,-p.twist*.7,0);
    [0,1].forEach(i=>{ J.thigh[i].rotation.x=-p.k; J.knee[i].rotation.x=2*p.k; });
    J.hips.position.y=(L1+L2)*Math.cos(p.k)+C.body.foot;
  }
  _blinkLoop(){ const go=()=>{ gsap.to(this.J.lids.map(l=>l.rotation),{ x:.12, duration:.07, yoyo:true, repeat:1, ease:'power1.in', onComplete:()=>{ this.J.lids.forEach(l=>l.rotation.x=-.7); gsap.delayedCall(rnd(...C.time.blink),go); } }); }; gsap.delayedCall(rnd(...C.time.blink),go); }
  _end(){ return V(C.camera.end).multiply(new THREE.Vector3(1,1,this.zMul||1)); }
  _resize(){ const w=innerWidth,h=innerHeight,a=w/h; this.r.setSize(w,h,false); this.cam.aspect=a; this.zMul=Math.max(1,C.camera.portraitBoost/a); this.cam.updateProjectionMatrix(); }

  /* ---- choreography ---- */
  play(onPhase){
    this.onPhase=onPhase; const T=C.time, d=this.d, P=this.pose, e=this._end();
    gsap.to(this.cam.position,{ x:e.x, y:e.y, z:e.z, duration:T.intro*d, ease:'power3.inOut', onComplete:()=>this.introDone=true }); onPhase('intro');
    const tl=gsap.timeline({ delay:(T.intro*.6+T.idle)*d });
    tl.add(()=>{ onPhase('windup'); this.sound.rustle(); },0)
      .to(P,{ rSh:1.15, rEl:-.95, rAbd:.28, twist:-.6, lSh:-1.25, lEl:-.25, lAbd:.1, k:.28, lean:-.06, look:.05, duration:T.windup*d, ease:'power2.inOut' },0)
      .to(P,{ rSh:-2.3, rEl:-.15, rAbd:.1, twist:.55, lSh:.35, lEl:-.6, k:.12, lean:.18, look:.22, duration:T.throw*d, ease:'power3.in' },`+=${.12*d}`)
      .add(()=>this._launch(),`-=${T.throw*.12*d}`)
      .to(P,{ rSh:-2.9, rEl:-.05, lean:.28, twist:.7, duration:T.follow*.4*d, ease:'power2.out' })
      .to(P,{ ...this._idle(), duration:T.follow*d, ease:'power2.inOut' });
  }
  _launch(){
    const T=C.time, d=this.d, b=this.ball; this.scene.attach(b); this.sound.snap(); this.sound.whoosh(T.flight);
    const s=b.position.clone(), e=V(C.ball.hold), m=s.clone().lerp(e,.5); m.y+=C.ball.arc; const curve=new THREE.CatmullRomCurve3([s,m,e]), prog={ t:0 };
    this.onPhase('throw'); this.flying=true;
    gsap.to(b.scale,{ x:C.ball.hero, y:C.ball.hero, z:C.ball.hero, duration:T.flight*d, ease:'power2.out' });
    gsap.to(prog,{ t:1, duration:T.flight*d, ease:'expo.out', onUpdate:()=>{ b.position.copy(curve.getPoint(prog.t)); this.flare.position.copy(b.position); this.glow.position.copy(b.position); }, onComplete:()=>this._freeze() });
    gsap.to(this.glow.material,{ opacity:.5, duration:T.flight*.6*d });
  }
  _freeze(){
    const T=C.time, d=this.d; this.flying=false; this.frozen=true; this.onPhase('freeze'); this.sound.impact(); this._shake();
    gsap.to(this,{ ts:T.slowMo, duration:.6*d }); gsap.to(this.flare,{ intensity:40, duration:.5*d, yoyo:true, repeat:1 }); gsap.to(this.glow.material,{ opacity:.9, duration:.6*d });
    gsap.delayedCall(T.hover*d,()=>this._reveal());
  }
  _shake(){ if(this.reduced) return; gsap.fromTo(this.cam.position,{ x:'+=.05', y:'+=.03' },{ x:'-=.05', y:'-=.03', duration:.07, repeat:5, yoyo:true, ease:'sine.inOut' }); }
  _reveal(){
    const T=C.time, d=this.d, p=this.ball.position.clone(); this.onPhase('reveal'); this.sound.shimmer(); gsap.to(this,{ ts:1, duration:.8*d });
    this.logo.position.copy(p); this.logo.visible=true; this.wave.position.copy(p); this.wave.visible=true; this.wave.lookAt(this.cam.position); this.wave.scale.setScalar(.1); this.wave.material.opacity=.9; this._emit(p);
    gsap.timeline().to(this.ball.scale,{ x:1e-4, y:1e-4, z:1e-4, duration:.45*d, ease:'power4.in' })
      .to(this.wave.scale,{ x:14, y:14, z:14, duration:T.reveal*d, ease:'expo.out' },'<').to(this.wave.material,{ opacity:0, duration:T.reveal*d },'<')
      .to(this.logo.scale,{ x:1, y:1, z:1, duration:T.reveal*d, ease:'back.out(1.5)' },'<.2').fromTo(this.logo.rotation,{ y:-Math.PI*1.5 },{ y:0, duration:T.reveal*1.2*d, ease:'expo.out' },'<')
      .to(this.flare,{ intensity:16, duration:d },'<').to(this.glow.scale,{ x:5, y:5, duration:T.reveal*d, ease:'power2.out' },'<')
      .add(()=>{ this.revealed=true; this.onPhase('ready'); },'-=.4');
  }
  _emit(o){ const a=this.burst.geometry.attributes.position; for(let i=0;i<C.burst.n;i++){ a.setXYZ(i,o.x,o.y,o.z); const v=new THREE.Vector3().randomDirection().multiplyScalar(C.burst.speed*(.3+Math.random())); this.burstVel.set([v.x,v.y,v.z],i*3); } a.needsUpdate=true; this.burst.visible=true; this.burst.material.opacity=1; this.age=0; }

  /* ---- frame loop: getDelta() called exactly once ---- */
  _tick(){
    const dt=Math.min(this.clock.getDelta(),.05), t=this.clock.elapsedTime, sdt=dt*this.ts;
    this._apply(t); this.sky.rotation.y+=sdt*.004; this.medal.rotation.y+=sdt*.1;
    const dp=this.dust.geometry.attributes.position; for(let i=0;i<C.dust.n;i++){ let y=dp.getY(i)+C.dust.rise*sdt; if(y>C.dust.box[1]) y=0; dp.setY(i,y); } dp.needsUpdate=true;
    if(this.flying) this.ball.rotation.x+=C.ball.spin*dt;
    if(this.frozen&&!this.revealed){ this.ball.rotation.y+=sdt*.8; this.ball.position.y=C.ball.hold[1]+Math.sin(t*C.ball.floatSpeed)*C.ball.float; this.glow.position.copy(this.ball.position); }
    if(this.logo.visible){ this.rings[0].rotation.z+=sdt*.35; this.rings[1].rotation.z-=sdt*.22; this.gem.rotation.y+=sdt*1.1; this.logo.position.y=C.ball.hold[1]+Math.sin(t*C.ball.floatSpeed)*C.ball.float*1.5; this.glow.position.copy(this.logo.position); }
    if(this.burst.visible){ const a=this.burst.geometry.attributes.position, k=Math.exp(-C.burst.drag*dt); this.age+=dt;
      for(let i=0;i<C.burst.n*3;i++){ this.burstVel[i]*=k; a.array[i]+=this.burstVel[i]*dt; } a.needsUpdate=true; this.burst.material.opacity=Math.max(0,1-this.age/C.burst.life); if(this.age>C.burst.life) this.burst.visible=false; }
    if(this.introDone&&!this.reduced){ const e=this._end(), p=C.camera.parallax; this.cam.position.z+=(e.z-this.cam.position.z)*.05;
      this.look.x+=(this.ptr.x*p-this.look.x)*.04; this.look.y+=(C.camera.look[1]+this.ptr.y*p*.5-this.look.y)*.04; }
    this.cam.lookAt(this.look); this.r.render(this.scene,this.cam);
  }
}

/* ============ DOM / UI ============ */
const $=id=>document.getElementById(id);
$('gname').textContent=C.brand.name; $('hint').textContent=C.brand.hint; { const [a,...b]=C.brand.credit.split(' '); $('credit').innerHTML=`${a} ${b.slice(0,1).join(' ')} <b>${b.slice(1).join(' ')}</b>`; gsap.fromTo('#credit',{ opacity:0, y:10 },{ opacity:1, y:0, duration:1.4, delay:.6, ease:'power2.out' }); } $('tagline').textContent=C.brand.tagline;
$('wordmark').setAttribute('aria-label',C.brand.name); $('wordmark').innerHTML=[...C.brand.name].map(c=>`<span>${c}</span>`).join('');
$('dests').innerHTML=C.brand.dests.map(n=>`<a class="dest" href="${n.href}"><b>${n.name}</b><i>${C.brand.go}</i></a>`).join('');
['selectstart','dragstart','contextmenu','copy','cut'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('visibilitychange',()=>{ const c=stage&&stage.sound.ctx; if(c) document.hidden?c.suspend():c.resume(); });
addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&['a','c','x','s','u'].includes(e.key.toLowerCase())) e.preventDefault(); });

const stage=new Stage($('gl'));
gsap.fromTo('#gate > *',{ y:24, opacity:0 },{ y:0, opacity:1, stagger:.15, duration:1.2, ease:'power3.out', clearProps:'opacity,transform' });
$('enter').textContent=C.brand.enter; $('enter').disabled=false; $('load').hidden=true; window.__elv=true;

const phase=p=>{
  if(p==='reveal'){ $('hud').hidden=false; gsap.fromTo('.wordmark span',{ y:40, opacity:0, letterSpacing:'1.2em' },{ y:0, opacity:1, letterSpacing:'0.42em', stagger:.08, duration:1.6, ease:'expo.out' }); }
  if(p==='ready'){ $('dests').hidden=false; gsap.fromTo('#tagline',{ opacity:0, y:12 },{ opacity:1, y:0, duration:1.2, ease:'power2.out' }); gsap.fromTo('.dest',{ opacity:0, y:24 },{ opacity:1, y:0, stagger:.15, duration:1, delay:.3, ease:'power3.out' }); }
};
$('enter').addEventListener('click',()=>{
  stage.sound.start(); $('mute').hidden=false;
  gsap.to('#gate',{ opacity:0, duration:.8, onComplete:()=>{ $('gate').hidden=true; stage.play(phase); } });
});
$('dests').addEventListener('click',e=>{ const a=e.target.closest('a.dest'); if(!a) return; e.preventDefault(); stage.sound.shimmer();
  gsap.to(['#hud','#gl','.vignette'],{ opacity:0, duration:.9, ease:'power2.inOut', onComplete:()=>{ location.href=a.getAttribute('href'); } }); });
$('mute').addEventListener('click',()=>{ const m=!stage.sound.muted; stage.sound.setMuted(m); $('mute').textContent=m?'Sound off':'Sound on'; });
</script>
